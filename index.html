<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
  
  <title>Noog: The Sudo-Flank Puzzle</title>
  <meta name="description" content="An original single-player logic puzzle fusing Go liberties, Othello flanking, and Sudoku uniqueness constraints.">
  
  <!-- Favicons and Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icons/icon-512.jpg">
  
  <!-- iOS Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Noog">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header / HUD -->
    <header>
      <div class="title-area">
        <div style="display: flex; align-items: center; gap: 6px;">
          <h1>NOOG</h1>
          <button id="btn-info" class="info-icon-btn" title="Level info">ℹ️</button>
        </div>
        <p id="level-title">1. The Conversion</p>
      </div>
      <div class="stats">
        <div class="stat-box">
          <span class="stat-label">Score</span>
          <span id="score-value" class="stat-value">0</span>
        </div>
        <div class="stat-box">
          <span id="moves-label" class="stat-label">Moves Left</span>
          <span id="moves-value" class="stat-value">3</span>
        </div>
      </div>
    </header>

    <!-- Playthrough Tutorial Banner -->
    <div id="tutorial-banner" class="tutorial-banner" style="display: none;">
      <p id="tutorial-text"></p>
    </div>

    <!-- Board Container -->
    <div class="board-container">
      <div class="coord-y">
        <span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
      </div>
      <div class="board-grid" id="board-grid">
        <!-- Cells generated by UI script -->
      </div>
      <div class="coord-x">
        <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span>
      </div>
      <!-- Particle Effects Overlay -->
      <canvas id="particle-canvas"></canvas>
    </div>

    <!-- Hand / Placement Queue -->
    <div class="hand-container">
      <div class="hand-label">
        <span>Active Stone (Hand)</span>
        <span>Incoming Queue</span>
      </div>
      <div class="hand-stones" id="hand-stones">
        <!-- Hand slots populated by UI script -->
      </div>
    </div>

    <!-- Game Control Actions -->
    <div class="controls">
      <button id="btn-undo" class="btn" disabled>
        ↩️ Undo
      </button>
      <button id="btn-redo" class="btn" disabled>
        ↪️ Redo
      </button>
      <button id="btn-reset" class="btn">
        🔄 Reset
      </button>
    </div>

    <!-- PWA / Extra Options -->
    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px;">
      <button id="btn-level-select" class="btn">
        🧩 Select Matrix (Levels)
      </button>
      <button id="btn-mode-toggle" class="btn">
        ⚡ Switch Zen Mode
      </button>
      <button id="btn-install" class="btn primary" style="display: none;">
        📲 Install Noog to Device
      </button>
    </div>
  </div>

  <!-- Overlay / Levels Dialog -->
  <div class="overlay" id="level-overlay">
    <div class="dialog">
      <h2 id="dialog-title">Select Level</h2>
      <div class="level-list" id="level-list">
        <!-- Levels dynamically generated -->
      </div>
      <button id="btn-close-overlay" class="btn">Close</button>
    </div>
  </div>

  <!-- Script Modules -->
  <script src="src/levels.js"></script>
  <script src="src/game.js"></script>
  <script src="src/ui.js"></script>

  <!-- Service Worker Registration -->
  <script src="src/sw-register.js"></script>
</body>
</html>
